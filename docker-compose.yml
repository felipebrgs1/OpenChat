name: nexo

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: http://localhost:3001
    init: true
    ports:
      - "5173:80"
    env_file:
      - path: .env
        required: false
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3001
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/nexo
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-nexo-private}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-nexo}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-nexo12345}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      STORAGE_DIR: /data/storage
      DOCLING_WORKER_URL: http://docling-worker:8001
      OCR_ENABLED: ${OCR_ENABLED:-false}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # R3 — Docling worker (Python) para extração estruturada PDF/DOCX/PPTX/XLSX/HTML.
  # Opcional em dev (fallback local via pdf-parse/mammoth). Em produção, ligar com --profile docling.
  docling-worker:
    build:
      context: ./workers/docling
      dockerfile: Dockerfile
    container_name: nexo-docling
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      OCR_ENABLED: ${OCR_ENABLED:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    profiles: ["docling"]

  # R2 — RustFS (S3 compatível). Em dev usamos MinIO, mesma API S3.
  # Produção: trocar imagem por rustfs/rustfs:latest com TLS e rede privada.
  rustfs:
    image: minio/minio:latest
    container_name: nexo-rustfs
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-nexo}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-nexo12345}
    volumes:
      - nexo_rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.1-pg18
    container_name: nexo-postgres
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5434:5432"
    volumes:
      - nexo_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  nexo_postgres_data:
  nexo_rustfs_data:
