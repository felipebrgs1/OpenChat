<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    :root {
      --fg: #09090b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #f4f4f5;
      }
    }
    .oraculo-ring { stroke: var(--fg); }
