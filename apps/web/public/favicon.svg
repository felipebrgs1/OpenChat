    .oraculo-pupil { fill: var(--fg); }
  </style>
  <circle cx="16" cy="16" r="12" class="oraculo-ring" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 8.5 16 C 11.2 11.2, 20.8 11.2, 23.5 16 C 20.8 20.8, 11.2 20.8, 8.5 16 Z" class="oraculo-lens" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="16" cy="16" r="2.8" class="oraculo-pupil" />
</svg>
